  <body>
    <!-- ── Desktop ──────────────────────────────────────────────── -->
    <div id="desktop">

      <!-- Desktop icons -->
      <div class="desktop-icons">
        <div class="desktop-icon" id="terminal-icon" role="button" tabindex="0"
             aria-label="Konsole — double-click to open">
          <div class="icon-gfx">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="15" rx="2"/>
              <polyline points="6 9 10 12 6 15"/>
              <line x1="13" y1="15" x2="18" y2="15"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="18" x2="12" y2="21"/>
            </svg>
          </div>
          <span class="icon-label">Konsole</span>
        </div>
      </div>

      <!-- Terminal windows injected dynamically by main.ts -->

      <!-- Snap preview overlay -->
      <div id="snap-preview"></div>

      <!-- Sarcastic notification stack (items injected by JS) -->
      <div id="notif-container" role="log" aria-live="polite"></div>

      <!-- Start Menu (Application Launcher) -->
      <div id="start-menu" class="start-menu" aria-hidden="true" role="dialog" aria-label="Application Launcher"></div>

      <!-- Taskbar -->
      <div id="taskbar">
        <div class="tb-left">
          <button class="tb-launcher" title="Applications" aria-label="Launcher">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor">
              <rect x="1" y="1" width="6" height="6" rx="1.2"/>
              <rect x="9" y="1" width="6" height="6" rx="1.2"/>
              <rect x="1" y="9" width="6" height="6" rx="1.2"/>
              <rect x="9" y="9" width="6" height="6" rx="1.2"/>
            </svg>
          </button>
        </div>

        <div class="tb-center" id="tb-center">
          <!-- Open window buttons injected by JS -->
        </div>

        <div class="tb-right">
          <!-- Ethernet -->
          <div class="tb-widget" id="tb-network" title="Ethernet — Connected">
            <svg viewBox="0 0 20 18" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <rect x="7" y="1" width="6" height="4" rx="1"/>
              <rect x="0.5" y="12" width="5" height="4" rx="1"/>
              <rect x="7.5" y="12" width="5" height="4" rx="1"/>
              <rect x="14.5" y="12" width="5" height="4" rx="1"/>
              <path d="M10 5v3M3 12v-2a1.5 1.5 0 011.5-1.5h11A1.5 1.5 0 0117 10v2"/>
              <path d="M3.5 10H10M10 10h6.5"/>
            </svg>
          </div>

          <!-- Battery -->
          <div class="tb-widget" id="tb-battery-widget" title="Battery">
            <svg id="tb-bat-svg" viewBox="0 0 22 12" width="22" height="12"
                 fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="0.65" y="1.5" width="18.7" height="9" rx="1.8"/>
              <path d="M19.5 4.5v3" stroke-width="2.5"/>
              <rect id="bat-fill" x="2" y="3" width="14" height="6" rx="1"
                    fill="currentColor" stroke="none"/>
            </svg>
            <span id="tb-bat-pct">--%</span>
          </div>

          <div class="tb-sep"></div>

          <!-- Clock -->
          <div class="tb-clock" id="tb-clock-widget">
            <span id="tb-time">--:--:--</span>
            <span id="tb-date">--- --</span>
            <div class="clock-tooltip">
              <div id="tt-day"></div>
              <div id="tt-fulldate"></div>
              <div id="tt-fulltime"></div>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /#desktop -->
